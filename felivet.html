<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Felivet Insight | Faisal L. Mohammad</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <style>
        /* Specific layout for the Project Details Page */
        .project-header {
            background-color: var(--bg-light);
            padding: 60px 10%;
            text-align: center;
            border-bottom: 4px solid var(--light-orange);
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            gap: 15px;
        }
        .project-header h1 {
            color: var(--primary-orange);
            font-size: 3rem;
            margin-bottom: 10px;
        }
        .project-container {
            display: flex;
            gap: 50px;
            padding: 60px 10%;
            flex-wrap: wrap;
        }
        .project-main {
            flex: 2;
            min-width: 300px;
        }
        .project-main h2 {
            color: var(--brown);
            margin: 30px 0 15px 0;
            font-size: 1.8rem;
        }
        .project-main ul {
            margin-left: 20px;
            margin-bottom: 15px;
        }
        .project-main li {
            margin-bottom: 8px;
        }
        
        /* New Right Column Wrapper */
        .project-right {
            flex: 1;
            min-width: 280px;
            display: flex;
            flex-direction: column;
            gap: 40px; /* Space between sidebar box and UI image */
        }
        
        .project-sidebar {
            background: var(--white);
            padding: 30px;
            border-radius: 16px;
            box-shadow: 0 6px 20px rgba(139, 83, 18, 0.08);
            border: 2px solid var(--light-orange);
        }
        .project-sidebar h3 {
            color: var(--primary-orange);
            margin-bottom: 20px;
            font-size: 1.5rem;
            border-bottom: 2px solid var(--bg-light);
            padding-bottom: 10px;
        }
        .fact-item {
            margin-bottom: 20px;
        }
        .fact-item span {
            display: block;
            font-size: 0.9rem;
            color: var(--brown);
            font-weight: 700;
            margin-bottom: 4px;
        }
        .fact-item p {
            font-size: 1rem;
            color: var(--black);
        }
        @media (max-width: 768px) {
            .project-container {
                flex-direction: column;
            }
        }
    </style>
</head>
